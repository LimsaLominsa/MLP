# Full fine-tuning config — BillSum × Qwen2.5-1.5B-Instruct
# All parameters are updated (no LoRA). Memory requirement: ~40GB+ GPU.
# Compare against: lora_billsum_qwen.yaml

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  task: "summarization"

# No 'lora' section — train.py treats this as full fine-tuning.

training:
  seed: 42
  num_train_epochs: 1
  learning_rate: 2.0e-5             # lower LR than LoRA (2e-4); standard for full FT
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  per_device_train_batch_size: 1    # smaller batch to fit full model in GPU memory
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16   # effective batch = 16 (same as LoRA baseline)
  gradient_checkpointing: true
  fp16: false
  bf16: true                        # A100/H100; switch to fp16 for V100/T4
  optim: "adamw_torch"
  weight_decay: 0.01
  max_grad_norm: 1.0
  evaluation_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"
  logging_steps: 50

data:
  train: "data/billsum/train_sft.jsonl"
  val:   "data/billsum/val_sft.jsonl"
  test_us: "data/billsum/test_us_sft.jsonl"
  test_ca: "data/billsum/test_ca_sft.jsonl"
  max_input_length: 16384
  max_output_length: 2048
  text_field: "input"
  label_field: "output"

output:
  dir: "outputs/full_billsum_qwen"
