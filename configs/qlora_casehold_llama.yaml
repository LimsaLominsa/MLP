# QLoRA fine-tuning config — CaseHOLD × Llama-3.2-1B-Instruct
# Method: 4-bit quantisation (QLoRA) via bitsandbytes + TRL SFTTrainer
# GPU requirement: 11GB+ (RTX 2080 Ti / T4 / V100-16G)
# Compare against: lora_casehold_llama.yaml (standard LoRA, train.py)
# Note: Llama requires HuggingFace license acceptance + huggingface-cli login
#
# Run:
#   python src/train/train_casehold_lora.py --config configs/qlora_casehold_llama.yaml

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  task: "classification"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"

training:
  seed: 42
  num_train_epochs: 1
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  weight_decay: 0.0
  logging_steps: 20
  eval_steps: 400
  save_steps: 400
  save_total_limit: 2
  report_to: "wandb"

data:
  train: "data/casehold/train_mc.jsonl"
  val:   "data/casehold/validation_mc.jsonl"
  test:  "data/casehold/test_mc.jsonl"
  max_length: 1024
  text_field: "text"

output:
  dir: "outputs/qlora_casehold_llama"
