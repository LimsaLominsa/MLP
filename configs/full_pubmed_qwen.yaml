# Full fine-tuning config — PubMed Summarization × Qwen2.5-1.5B-Instruct

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  task: "summarization"

# No 'lora' section — train.py treats this as full fine-tuning.

training:
  seed: 42
  num_train_epochs: 1
  learning_rate: 2.0e-5             # lower LR for full FT
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4     # effective batch = 16
  gradient_checkpointing: true
  fp16: false
  bf16: true
  optim: "adamw_torch"
  weight_decay: 0.01
  max_grad_norm: 1.0
  evaluation_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"
  logging_steps: 50

data:
  train: "data/pubmed/train_sft.jsonl"
  val:   "data/pubmed/val_sft.jsonl"
  test:  "data/pubmed/test_sft.jsonl"
  max_input_length: 2048
  max_output_length: 512
  text_field: "input"
  label_field: "output"

output:
  dir: "outputs/full_pubmed_qwen"
