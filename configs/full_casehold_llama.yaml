# Full fine-tuning config — CaseHOLD × Llama-3.2-1B-Instruct
# All parameters are updated (no LoRA).
# Compare against: lora_casehold_llama.yaml
# Note: Llama requires HuggingFace license acceptance + huggingface-cli login.

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  task: "classification"

# No 'lora' section — train.py treats this as full fine-tuning.

training:
  seed: 42
  num_train_epochs: 1
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  fp16: false
  bf16: true
  optim: "adamw_torch"
  weight_decay: 0.01
  max_grad_norm: 1.0
  evaluation_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"
  logging_steps: 50

data:
  train: "data/casehold/train_mc.jsonl"
  val:   "data/casehold/validation_mc.jsonl"
  test:  "data/casehold/test_mc.jsonl"
  max_length: 1024
  text_field: "input"
  label_field: "output"

output:
  dir: "outputs/full_casehold_llama"
