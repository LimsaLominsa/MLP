# LoRA fine-tuning config — BillSum × Llama-3.2-1B-Instruct

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  task: "summarization"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  seed: 42
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16    # effective batch = 16
  gradient_checkpointing: true
  fp16: true
  bf16: false
  optim: "adamw_torch"
  weight_decay: 0.01
  max_grad_norm: 1.0
  evaluation_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"
  logging_steps: 50

data:
  train: "data/billsum/train_sft.jsonl"
  val:   "data/billsum/val_sft.jsonl"
  test_us: "data/billsum/test_us_sft.jsonl"
  test_ca: "data/billsum/test_ca_sft.jsonl"
  max_input_length: 2048
  max_output_length: 512
  text_field: "input"
  label_field: "output"

output:
  dir: "outputs/lora_billsum_llama"
