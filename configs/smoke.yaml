project:
  name: g104_smoke
  phase: phase1
  task: casehold
  output_root: outputs

data:
  raw_dir: data/raw
  processed_dir: data/processed
  dataset_name: synthetic
  train_file: data/processed/smoke_train.jsonl
  valid_file: data/processed/smoke_validation.jsonl
  test_file: data/processed/smoke_test.jsonl
  fixed_eval_subset_file: data/processed/smoke_eval_fixed.jsonl
  fixed_eval_subset_size: 24

model_name: Qwen/Qwen2.5-1.5B-Instruct
backend: mock

lora_config:
  r: 4
  lora_alpha: 8
  lora_dropout: 0.0
  target_modules: [q_proj]

seed: 7
seeds: [7, 8, 9]

train_args:
  num_train_epochs: 1
  learning_rate: 0.001
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 1
  max_seq_length: 256

experiments:
  - pretrained
  - lora_sft
  - random_label

metrics:
  faithfulness_topk_ratio: 0.2
  deletion_steps: 5
  insertion_steps: 5
  bootstrap_samples: 200

analysis:
  cka_layers: [0, 1, 2, 3]
  attention_bins: 10
